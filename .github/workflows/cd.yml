name: CD

on:
  push:
    tags:
      - 'v*'

# No container image is built or published: the project ships a binary (see Makefile `build`), and
# the former docker job could not succeed — it referenced a Dockerfile that did not exist, and the
# compose stack it belonged to had no postgres service while `make demo-up` waited for one.
permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
