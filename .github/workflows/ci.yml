name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Format check
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Code not formatted. Run 'goimports -w .'"
            gofmt -l .
            exit 1
          fi

      - name: Convergence freeze check
        run: bash scripts/check_convergence_freeze.sh

      - name: Documentation anchor drift check
        run: bash scripts/check_doc_anchors.sh

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: "latest"

      # Do NOT use golangci/golangci-lint-action here: its `version: latest`
      # resolves within the v1 line, which is built with an older Go and refuses
      # a config for a newer target ("the Go language version (go1.24) used to
      # build golangci-lint is lower than the targeted Go version (1.26.1)").
      # .golangci.yml is v2-schema, so build the v2 line with this job's own
      # toolchain and run the repo's tuned target.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: golangci-lint
        run: make ci-lint

  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.26']
    env:
      # Pin the two things a dev box gets wrong, so `make ci-test` and this job
      # behave identically:
      #   * TZ — runners are UTC, a local box usually is not. A test comparing
      #     time.Time STRUCTS instead of instants passes locally and fails here.
      #   * GOMAXPROCS — the 2-vCPU runner defaults to 2, which starves the
      #     deadline-sensitive e2e tests; the Makefile's own measurements show
      #     GOMAXPROCS=4 already starving them on a 14-core box.
      TZ: UTC
      GOMAXPROCS: "4"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      # One command — the same one developers run locally (`make ci-test`), so
      # the two can no longer drift. It covers the unit suite (race, -count=1,
      # coverage) AND the G1-G4 gates: `go test ./...` does NOT compile
      # //go:build closure files, so without the gate step the design-doc
      # acceptance tests never run in CI. TEST_PARALLEL and the longer timeout
      # are the only CI-specific knobs.
      - name: Tests + architecture/acceptance gates (same as `make ci-test`)
        run: make ci-test TEST_PARALLEL=2 CI_TEST_TIMEOUT=600s

      - name: Coverage summary
        run: go tool cover -func=cover.out | tail -1

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: cover.out

      - name: Build all examples
        run: make examples

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    env:
      # Same pinning as the test job (see there). The only genuine difference
      # from a local run is the service below: with it the DSN-gated tests
      # execute instead of skipping, which is why this class only fails in CI.
      TZ: UTC
      GOMAXPROCS: "4"
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ARES_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Integration tests (same as `make ci-test-integration`)
        env:
          TEST_POSTGRES_DSN: "postgres://postgres:postgres@localhost:5432/ARES_test?sslmode=disable"
        run: make ci-test-integration TEST_PARALLEL=2 CI_TEST_TIMEOUT=600s

  # No benchmark job: benchmark numbers are only meaningful on a quiet machine,
  # and the job cost minutes per PR (it had already been reduced to a bare
  # checkout + setup-go). Record baselines on demand instead — see
  # benchmarks/benchmark_report.md and `make benchmark`.
