name: AgentOS Chaos CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Same one-toolchain policy as ci.yml: Go comes from go.mod, and GOTOOLCHAIN=local
# fails loudly instead of silently downloading a second toolchain. Keep in sync
# with ci.yml if the policy changes.
env:
  GOTOOLCHAIN: local

jobs:
  # Chaos-recovery e2e: exercises the arena→injector→resurrection wiring. This
  # is the P2 milestone's "fault injection + recovery" gate: it runs on every PR
  # so a regression in the recovery path fails CI immediately. Benchmarks are
  # deliberately not part of this job (see the note on the steps below).
  chaos-e2e:
    name: Chaos recovery e2e
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Chaos recovery e2e (arena + runtime resurrection)
        run: go test -race -count=1 -timeout=120s -run 'TestE2EChaosRecovery' ./internal/runtime/arena/...

      # Benchmark steps deliberately removed: they cost minutes on every PR and
      # the numbers are only meaningful on a quiet machine. Record baselines on
      # demand instead — see benchmarks/benchmark_report.md and `make benchmark`.
