name: Tool Usage Evaluation
description: Test cases focused on tool usage verification
tags:
  - tools

test_cases:
  - id: tool-001
    name: Calculator Tool
    input: "What is 123 * 456?"
    expected_output: "56088"
    expected_tools:
      - calculator
    # Both halves, because this case has both: the delegated work must have run
    # AND the answer must be right. It is the shape most of this suite should
    # move to — see the corpus notes in docs/defects/cognition-persistence.md.
    checks: [tools, numeric]
    timeout: 30s
    tags:
      - math

  - id: tool-002
    name: Web Search Tool
    input: "Search for the latest news about AI"
    expected_tools:
      - web_search
    # Only the tool is checkable here: the answer is open-ended (the news
    # changes), so correctness stays with the judge. Anchoring what is provable
    # and saying so is the point — a fake expectation would be worse than none.
    checks: [tools]
    timeout: 60s
    tags:
      - search

  - id: tool-003
    name: File Operations
    input: "Read the file /tmp/test.txt and summarize its contents"
    expected_tools:
      - file_read
    checks: [tools]
    timeout: 30s
    tags:
      - file

  - id: tool-004
    name: Multiple Tools
    input: "Search for Python tutorials, calculate how many hours needed to learn, and save the plan to a file"
    expected_tools:
      - web_search
      - calculator
      - file_write
    checks: [tools]
    timeout: 90s
    tags:
      - multi-tool
